services:
  - type: web
    name: leetcode-30-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: leetcode-30-bot
          property: host
      - key: CHALLENGE_START_DATE
        value: 2026-10-06
      - key: REMINDER_HOUR
        value: 19
      - key: REMINDER_MINUTE
        value: 0
      - key: TIMEZONE
        value: Europe/Budapest
      - key: DB_PATH
        value: leetcode30.db

name: Telegram AI Content

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send the AI content immediately for testing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  send-ai-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send scheduled Telegram content
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          if not token:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN GitHub secret.")

          subprocess.run(
              ["git", "fetch", "origin", "data-backup:data-backup"],
              check=True,
          )

          backup = json.loads(
              subprocess.check_output(
                  ["git", "show", "data-backup:data/backup.json"],
                  text=True,
              )
          )

          chat_ids = sorted({
              str(user["chat_id"])
              for user in backup.get("users", [])
              if user.get("chat_id") is not None
          })

          if not chat_ids:
              raise SystemExit("No Telegram chat IDs found in data-backup/data/backup.json.")

          with open("ai/daily_content.json", encoding="utf-8") as f:
              content = json.load(f)

          now = datetime.now(ZoneInfo("Europe/Budapest"))
          hour = now.hour
          today = now.date().isoformat()
          test_message = os.environ.get("TEST_MESSAGE", "").lower() == "true"

          if test_message:
              message = (
                  f"🧪 <b>AI Content Test — Day {content['day']}</b>\n\n"
                  f"<b>{content['morning_concept']}</b>\n"
                  f"{content['morning_concept_explanation']}\n\n"
                  f"🌙 <b>Evening:</b> {content['evening_feedback']}"
              )
          elif hour == 9:
              message = (
                  f"🌅 <b>Day {content['day']} — Morning Concept</b>\n\n"
                  f"<b>{content['morning_concept']}</b>\n"
                  f"{content['morning_concept_explanation']}"
              )
          elif hour == 19:
              message = (
                  f"🌙 <b>Day {content['day']} — Evening Feedback</b>\n\n"
                  f"{content['evening_feedback']}"
              )
          else:
              print(f"No AI message scheduled for local time {now.isoformat()}.")
              raise SystemExit(0)

          if not test_message and content.get("date") != today:
              print(
                  f"Skipping: content date {content.get('date')} "
                  f"does not match Budapest date {today}."
              )
              raise SystemExit(0)

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          for chat_id in chat_ids:
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": message,
                  "parse_mode": "HTML",
              }).encode()

              request = urllib.request.Request(url, data=payload, method="POST")
              with urllib.request.urlopen(request) as response:
                  result = json.loads(response.read().decode())

              if not result.get("ok"):
                  raise SystemExit(
                      f"Telegram API failed for chat {chat_id}: {result}"
                  )

              print(f"Sent AI content to {chat_id}.")
          PY

name: Telegram AI Content

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send the AI content immediately for testing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  send-ai-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send scheduled Telegram content
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          if not token:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN GitHub secret.")

          subprocess.run(
              ["git", "fetch", "origin", "data-backup:data-backup"],
              check=True,
          )

          backup = json.loads(
              subprocess.check_output(
                  ["git", "show", "data-backup:data/backup.json"],
                  text=True,
              )
          )

          chat_ids = sorted({
              str(user["chat_id"])
              for user in backup.get("users", [])
              if user.get("chat_id") is not None
          })

          if not chat_ids:
              raise SystemExit("No Telegram chat IDs found in data-backup/data/backup.json.")

          with open("ai/daily_content.json", encoding="utf-8") as f:
              content = json.load(f)

          def extract_urls(text):
              return re.findall(r"https?://[^\s<>|]+", str(text))

          def clean_url(url):
              return url.rstrip(".,;)")

          def source_keyboard(text):
              urls = []
              for url in extract_urls(text):
                  url = clean_url(url)
                  if url not in urls:
                      urls.append(url)
              buttons = [
                  [{"text": f"🔗 Source {i}", "url": url}]
                  for i, url in enumerate(urls[:4], 1)
              ]
              return {"inline_keyboard": buttons} if buttons else None

          def format_ai_text(raw):
              text = str(raw).strip()
              source_urls = []
              for url in extract_urls(text):
                  url = clean_url(url)
                  if url not in source_urls:
                      source_urls.append(url)

              text = re.sub(r"https?://[^\s<>|]+", "", text)
              text = html.escape(text)

              lines = [line.strip() for line in text.splitlines()]
              out = []

              for line in lines:
                  if not line:
                      if out and out[-1] != "":
                          out.append("")
                      continue

                  if line.startswith("Question:"):
                      value = line[len("Question:"):].strip()
                      out.append(f"🎯 <b>Question</b>\n<blockquote>{value}</blockquote>")
                  elif line.startswith("Reported signal:"):
                      value = line[len("Reported signal:"):].strip()
                      out.append(f"📡 <b>Reported signal</b>\n{value}")
                  elif line.startswith("Follow-ups:"):
                      value = line[len("Follow-ups:"):].strip()
                      items = [x.strip() for x in value.split(" • ") if x.strip()]
                      out.append("🔎 <b>Likely follow-ups</b>\n" + "\n".join(f"• {x}" for x in items))
                  elif line.startswith("What it tests:"):
                      value = line[len("What it tests:"):].strip()
                      out.append(f"🧠 <b>What it tests</b>\n{value}")
                  elif line.startswith("Evidence:"):
                      value = line[len("Evidence:"):].strip()
                      out.append(f"⚖️ <b>Evidence</b>\n<i>{value}</i>")
                  elif line.startswith("Repeated signal:"):
                      value = line[len("Repeated signal:"):].strip()
                      out.append(f"📈 <b>Repeated signal</b>\n{value}")
                  elif line.startswith("Candidate experience:"):
                      value = line[len("Candidate experience:"):].strip()
                      out.append(f"🗣 <b>Candidate experience</b>\n{value}")
                  elif line.startswith("Watch for:"):
                      value = line[len("Watch for:"):].strip()
                      items = [x.strip() for x in value.split(" • ") if x.strip()]
                      out.append("⚠️ <b>Watch for</b>\n" + "\n".join(f"• {x}" for x in items))
                  elif line.startswith("Evidence quality:"):
                      value = line[len("Evidence quality:"):].strip()
                      out.append(f"⚖️ <b>Evidence quality</b>\n<i>{value}</i>")
                  elif line.startswith("Sources:"):
                      continue
                  else:
                      out.append(line)

              while out and out[-1] == "":
                  out.pop()

              return "\n\n".join(out), source_urls

          def build_message(title, body, emoji):
              formatted, urls = format_ai_text(body)
              message = (
                  f"{emoji} <b>{html.escape(title)}</b>\n"
                  f"<i>Interview intelligence • Day {content['day']}</i>\n\n"
                  f"{formatted}"
              )
              return message, urls

          morning_message, morning_urls = build_message(
              content["morning_concept"],
              content["morning_concept_explanation"],
              "💼",
          )

          evening_message, evening_urls = build_message(
              "Candidate feedback",
              content["evening_feedback"],
              "🌙",
          )

          now = datetime.now(ZoneInfo("Europe/Budapest"))
          hour = now.hour
          today = now.date().isoformat()
          test_message = os.environ.get("TEST_MESSAGE", "").lower() == "true"

          if not test_message and content.get("date") != today:
              print(
                  f"Skipping: content date {content.get('date')} "
                  f"does not match Budapest date {today}."
              )
              raise SystemExit(0)

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          def send_message(chat_id, message, source_urls):
              payload = {
                  "chat_id": chat_id,
                  "text": message,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }
              if source_urls:
                  payload["reply_markup"] = json.dumps({
                      "inline_keyboard": [
                          [{"text": f"🔗 Source {i}", "url": source}]
                          for i, source in enumerate(source_urls[:4], 1)
                      ]
                  })

              encoded = urllib.parse.urlencode(payload).encode()
              request = urllib.request.Request(url, data=encoded, method="POST")
              with urllib.request.urlopen(request) as response:
                  result = json.loads(response.read().decode())

              if not result.get("ok"):
                  raise SystemExit(
                      f"Telegram API failed for chat {chat_id}: {result}"
                  )

          for chat_id in chat_ids:
              if test_message:
                  test_morning, _ = build_message(
                      content["morning_concept"],
                      content["morning_concept_explanation"],
                      "🧪",
                  )
                  test_evening, _ = build_message(
                      "Candidate feedback",
                      content["evening_feedback"],
                      "🧪",
                  )
                  send_message(chat_id, test_morning, morning_urls)
                  send_message(chat_id, test_evening, evening_urls)
              elif hour == 9:
                  send_message(chat_id, morning_message, morning_urls)
              elif hour == 19:
                  send_message(chat_id, evening_message, evening_urls)
              else:
                  print(f"No AI message scheduled for local time {now.isoformat()}.")
                  raise SystemExit(0)

              print(f"Sent AI content to {chat_id}.")
          PY

name: Telegram AI Content

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send the AI content immediately for testing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  send-ai-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send scheduled Telegram content
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          if not token:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN GitHub secret.")

          subprocess.run(
              ["git", "fetch", "origin", "data-backup:data-backup"],
              check=True,
          )

          backup = json.loads(
              subprocess.check_output(
                  ["git", "show", "data-backup:data/backup.json"],
                  text=True,
              )
          )

          chat_ids = sorted({
              str(user["chat_id"])
              for user in backup.get("users", [])
              if user.get("chat_id") is not None
          })

          if not chat_ids:
              raise SystemExit("No Telegram chat IDs found in data-backup/data/backup.json.")

          with open("ai/daily_content.json", encoding="utf-8") as f:
              content = json.load(f)

          def format_ai_text(text):
              """Turn AI prose into compact, readable Telegram HTML."""
              text = html.escape(str(text).strip())

              # Make the common labels visually scannable.
              labels = [
                  "Candidate feedback:",
                  "Sources:",
                  "Likely follow-ups:",
                  "What it tests:",
                  "One-off example:",
              ]
              for label in labels:
                  text = text.replace(
                      label,
                      f"\n\n<b>{label}</b>"
                  )

              # Put each source on its own compact line and hide long URLs.
              url_pattern = r"https?://[^\s<>]+"
              source_index = 0

              def link(match):
                  nonlocal source_index
                  source_index += 1
                  url = match.group(0).rstrip(".,)")
                  return f'<a href="{url}">Source {source_index}</a>'

              text = re.sub(url_pattern, link, text)

              # Clean up excessive blank lines while preserving section breaks.
              text = re.sub(r"\n{3,}", "\n\n", text)
              return text.strip()

          def morning_message(test=False):
              prefix = "🧪 <b>Interview Intel Test</b>" if test else f"🌅 <b>Day {content['day']} — Interview Intel</b>"
              return (
                  f"{prefix}\n\n"
                  f"💼 <b>{html.escape(content['morning_concept'])}</b>\n\n"
                  f"{format_ai_text(content['morning_concept_explanation'])}"
              )

          def evening_message(test=False):
              prefix = "🌙 <b>Candidate Feedback Test</b>" if test else f"🌙 <b>Day {content['day']} — Candidate Feedback</b>"
              return (
                  f"{prefix}\n\n"
                  f"{format_ai_text(content['evening_feedback'])}"
              )

          now = datetime.now(ZoneInfo("Europe/Budapest"))
          hour = now.hour
          today = now.date().isoformat()
          test_message = os.environ.get("TEST_MESSAGE", "").lower() == "true"

          if test_message:
              message = (
                  f"{morning_message(test=True)}\n\n"
                  f"{'━' * 24}\n\n"
                  f"{evening_message(test=True)}"
              )
          elif hour == 9:
              message = morning_message()
          elif hour == 19:
              message = evening_message()
          else:
              print(f"No AI message scheduled for local time {now.isoformat()}.")
              raise SystemExit(0)

          if not test_message and content.get("date") != today:
              print(
                  f"Skipping: content date {content.get('date')} "
                  f"does not match Budapest date {today}."
              )
              raise SystemExit(0)

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          for chat_id in chat_ids:
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": message,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode()

              request = urllib.request.Request(url, data=payload, method="POST")
              with urllib.request.urlopen(request) as response:
                  result = json.loads(response.read().decode())

              if not result.get("ok"):
                  raise SystemExit(
                      f"Telegram API failed for chat {chat_id}: {result}"
                  )

              print(f"Sent AI content to {chat_id}.")
          PY

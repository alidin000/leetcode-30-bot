name: Telegram AI Content

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send the AI content immediately for testing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  send-ai-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send scheduled Telegram content
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          if not token:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN GitHub secret.")

          subprocess.run(["git", "fetch", "origin", "data-backup:data-backup"], check=True)

          backup_raw = subprocess.check_output(
              ["git", "show", "data-backup:data/backup.json"], text=True
          )
          try:
              backup = json.loads(backup_raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  f"Invalid backup JSON on data-backup at line {exc.lineno}, "
                  f"column {exc.colno}: {exc.msg}"
              )

          chat_ids = sorted({
              str(user["chat_id"])
              for user in backup.get("users", [])
              if user.get("chat_id") is not None
          })
          if not chat_ids:
              raise SystemExit("No Telegram chat IDs found in data-backup/data/backup.json.")

          with open("ai/daily_content.json", encoding="utf-8") as f:
              try:
                  content = json.load(f)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"Invalid ai/daily_content.json on main at line {exc.lineno}, "
                      f"column {exc.colno}: {exc.msg}"
                  )

          def markdown_to_telegram_html(raw):
              """Convert ordinary AI Markdown into safe Telegram HTML generically."""
              text = str(raw).strip()
              blocks = []

              # Protect fenced code blocks before escaping/inline formatting.
              fence_re = re.compile(r"(?s)\`\`\`(?:[A-Za-z0-9_+.-]+)?\n?(.*?)\`\`\`")
              def save_code(match):
                  value = match.group(1).strip("\\n")
                  blocks.append("<pre>" + html.escape(value, quote=False) + "</pre>")
                  return f"@@CODEBLOCK_{len(blocks)-1}@@"

              text = fence_re.sub(save_code, text)

              # Protect inline code.
              inline_codes = []
              def save_inline(match):
                  inline_codes.append("<code>" + html.escape(match.group(1), quote=False) + "</code>")
                  return f"@@INLINECODE_{len(inline_codes)-1}@@"

              text = re.sub(r"`([^\`\n]+)`", save_inline, text)

              text = html.escape(text, quote=False)

              # Markdown links.
              text = re.sub(
                  r"\[([^\]]+)\]\((https?://[^)\s]+)\)",
                  lambda m: '<a href="' + html.escape(m.group(2), quote=True) + '">' +
                            html.escape(m.group(1), quote=False) + "</a>",
                  text,
              )

              # Raw URLs.
              text = re.sub(
                  r"https?://[^\s<>]+",
                  lambda m: '<a href="' + html.escape(m.group(0).rstrip(".,)"), quote=True) + '">' +
                            html.escape(m.group(0).rstrip(".,)"), quote=False) + "</a>",
                  text,
              )

              # Generic Markdown emphasis.
              text = re.sub(r"\*\*([^*\n]+)\*\*", r"<b>\1</b>", text)
              text = re.sub(r"(?<!\*)\*([^*\n]+)\*(?!\*)", r"<i>\1</i>", text)
              text = re.sub(r"__([^_\n]+)__", r"<b>\1</b>", text)
              text = re.sub(r"(?<!_)_([^_\n]+)_(?!_)", r"<i>\1</i>", text)

              # Headings of any level: # Heading -> bold Heading.
              text = re.sub(r"(?m)^\s{0,3}#{1,6}\s+(.+?)\s*$", r"<b>\1</b>", text)

              # Markdown blockquotes.
              text = re.sub(r"(?m)^\s*>\s?(.*)$", r"│ \1", text)

              # Normalize unordered/ordered list markers into Telegram-friendly bullets.
              text = re.sub(r"(?m)^\s*[-*+]\s+", "• ", text)
              text = re.sub(r"(?m)^\s*\d+[.)]\s+", "• ", text)

              # Markdown horizontal rules.
              text = re.sub(r"(?m)^\s*(?:---+|___+|\*\*\*+)\s*$", "────────────", text)

              # Restore protected code blocks/inline code.
              for i, value in enumerate(blocks):
                  text = text.replace(f"@@CODEBLOCK_{i}@@", value)
              for i, value in enumerate(inline_codes):
                  text = text.replace(f"@@INLINECODE_{i}@@", value)

              # Telegram renders literal angle brackets poorly if left in text;
              # html.escape above already made ordinary text safe.
              text = re.sub(r"\n{4,}", "\n\n", text)
              return text.strip()

          def format_content(raw, drop_first_heading=None):
              text = str(raw).strip()
              if drop_first_heading:
                  lines = text.splitlines()
                  if lines and lines[0].strip().lower() == drop_first_heading.lower():
                      text = "\n".join(lines[1:]).strip()
              return markdown_to_telegram_html(text)

          def split_message(text, limit=3900):
              """Split at paragraph boundaries so Telegram stays below 4096 chars."""
              if len(text) <= limit:
                  return [text]

              paragraphs = text.split("\n\n")
              chunks = []
              current = ""

              for paragraph in paragraphs:
                  candidate = paragraph if not current else current + "\n\n" + paragraph
                  if len(candidate) <= limit:
                      current = candidate
                  else:
                      if current:
                          chunks.append(current)
                      while len(paragraph) > limit:
                          cut = paragraph.rfind("\n", 0, limit)
                          if cut < 500:
                              cut = paragraph.rfind(" ", 0, limit)
                          if cut < 1:
                              cut = limit
                          chunks.append(paragraph[:cut].rstrip())
                          paragraph = paragraph[cut:].lstrip()
                      current = paragraph

              if current:
                  chunks.append(current)
              return chunks

          def morning_message(test=False):
              title = (
                  "🧪 <b>Interview Intel</b>"
                  if test
                  else f"🌅 <b>Day {content['day']} · Interview Intel</b>"
              )
              concept = html.escape(str(content["morning_concept"]).strip(), quote=False)
              body = format_content(content["morning_concept_explanation"])
              return f"{title}\n\n<b>{concept}</b>\n\n{body}"

          def evening_message(test=False):
              title = (
                  "🧪 <b>Candidate Feedback</b>"
                  if test
                  else f"🌙 <b>Day {content['day']} · Candidate Feedback</b>"
              )
              body = format_content(
                  content["evening_feedback"],
                  drop_first_heading="🌙 Candidate Feedback",
              )
              return f"{title}\n\n{body}"

          def telegram_messages():
              test_message = os.environ.get("TEST_MESSAGE", "").lower() == "true"

              if test_message:
                  # Never combine the full morning lesson and evening feedback:
                  # together they can exceed Telegram's 4096-character limit.
                  return split_message(morning_message(test=True)) + split_message(evening_message(test=True))

              if content.get("date") != today:
                  print(
                      f"Skipping: content date {content.get('date')} "
                      f"does not match Budapest date {today}."
                  )
                  return []

              if hour == 9:
                  return split_message(morning_message())
              if hour == 19:
                  return split_message(evening_message())

              print(f"No AI message scheduled for local time {now.isoformat()}.")
              return []

          now = datetime.now(ZoneInfo("Europe/Budapest"))
          hour = now.hour
          today = now.date().isoformat()
          messages = telegram_messages()

          if not messages:
              raise SystemExit(0)

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          for chat_id in chat_ids:
              for index, message in enumerate(messages, 1):
                  payload = urllib.parse.urlencode({
                      "chat_id": chat_id,
                      "text": message,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": "true",
                  }).encode()

                  request = urllib.request.Request(url, data=payload, method="POST")
                  try:
                      with urllib.request.urlopen(request) as response:
                          result = json.loads(response.read().decode())
                  except urllib.error.HTTPError as exc:
                      error_body = exc.read().decode("utf-8", errors="replace")
                      raise SystemExit(
                          f"Telegram API HTTP {exc.code} for chat {chat_id}, "
                          f"message {index}/{len(messages)}: {error_body}"
                      )

                  if not result.get("ok"):
                      raise SystemExit(
                          f"Telegram API failed for chat {chat_id}, "
                          f"message {index}/{len(messages)}: {result}"
                      )

                  print(
                      f"Sent AI content to {chat_id}, "
                      f"message {index}/{len(messages)} ({len(message)} chars)."
                  )
          PY
